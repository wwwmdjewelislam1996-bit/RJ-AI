<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RJ AI - Personal AI Assistant</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --chat-bg: #1e293b;
            --user-bg: #3b82f6;
            --bot-bg: #334155;
            --text-color: #f8fafc;
            --border-color: #475569;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: var(--chat-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
        }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .message.user {
            background-color: var(--user-bg);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .message.bot {
            background-color: var(--bot-bg);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .input-area {
            padding: 15px 20px;
            background-color: var(--chat-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 16px;
            outline: none;
        }
        button {
            padding: 12px 20px;
            border: none;
            background-color: var(--user-bg);
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">RJ AI Assistant</div>
    </header>

    <div id="chat">
        <div class="message bot">আসসালামু আলাইকুম আমি জুয়েল! আমি আপনার ব্যক্তিগত এআই অ্যাসিস্ট্যান্ট। আজ আপনাকে কীভাবে সাহায্য করতে পারি?</div>
    </div>

    <div class="input-area">
        <input type="text" id="prompt" placeholder="এখানে কিছু লিখুন..." autocomplete="off">
        <button onclick="sendMessage()">পাঠান</button>
    </div>

    <script>
        const workerUrl = "https://rj-ai-backend.www-mdjewelislam1996.workers.dev";

        const promptInput = document.getElementById('prompt');
        const chatContainer = document.getElementById('chat');

        promptInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        async function sendMessage() {
            const text = promptInput.value.trim();
            if (!text) return;

            // Add User Message
            appendMessage(text, 'user');
            promptInput.value = '';

            // Add Loading Bot Message
            const loadingId = appendThinkingMessage();

            try {
                const response = await fetch(workerUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                removeMessage(loadingId);

                if (data && data.response) {
                    appendMessage(data.response, 'bot');
                } else if (data && data.message) {
                    appendMessage(data.message, 'bot');
                } else {
                    appendMessage("দুঃখিত, কোনো উত্তর পাওয়া যায়নি।", 'bot');
                }
            } catch (error) {
                removeMessage(loadingId);
                appendMessage("সার্ভারের সাথে সংযোগ স্থাপন করতে সমস্যা হচ্ছে।", 'bot');
            }
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.textContent = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        function appendThinkingMessage() {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message bot';
            msgDiv.textContent = 'এআই ভাবছে...';
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        function removeMessage(msgDiv) {
            if (msgDiv && msgDiv.parentNode) {
                msgDiv.parentNode.removeChild(msgDiv);
            }
        }
    </script>
</body>
</html>
